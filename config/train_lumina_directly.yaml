    - "You are an assistant designed to generate anime images based on textual prompts. Your task is also to ensure that the characters in the image are positioned according to the normalized bounding box coordinates x1, x2, y1, y2 with values ranging from 1 to 1000. <Prompt Start> \nCharacters: #character_1:[30,925,35,945]\nDrawn by @{chen bin}\nThe image features a single anime-style girl with pink hair styled in a single side bun, sitting in the center of the frame. She has yellow eyes and a blush on her cheeks, giving her a youthful and gentle appearance. The girl is wearing a white sleeveless dress with frills and white pantyhose, with her panties visible underneath. She is sitting with her knees up and legs extended forward, showing the soles of her feet which are in focus. Her right hand is near her mouth, and she has an open-mouthed expression as she looks directly at the viewer. Above her head is a pink halo, and she has white feathered wings. The background shows an indoor setting with large windows allowing natural light to illuminate the scene. There's a bed visible beneath her, and some decorative elements and a plant can be seen in the background. The overall atmosphere is bright and cheerful with soft lighting. At the bottom of the image, there is text that reads \"Aether\" and some Japanese characters on the right side."
    - "You are an assistant designed to generate anime images based on textual prompts. Your task is also to ensure that the characters in the image are positioned according to the normalized bounding box coordinates x1, x2, y1, y2 with values ranging from 1 to 1000. <Prompt Start> \nCharacters: #character_1:[68,968,1,998]\nDrawn by @{shida kazuhiro}\nThe image features a single female anime character with long, flowing white/silver hair and striking yellow eyes. She has a youthful appearance with a slender build and is wearing a blue and white outfit with detached sleeves that expose her shoulders. Her cheeks are blushing pink, and she has a small, slightly open mouth that gives her an expression of shyness or surprise. Strands of her hair fall between her eyes, partially obscuring them, while she looks directly at the viewer. Her hands are clasped together in front of her chest in a gesture that suggests modesty or nervousness. The background is a dreamy, ethereal scene with blurry blue and light blue tones, featuring soft glowing light effects that create an otherworldly atmosphere. The character is positioned centrally in the frame, with the camera angle slightly from above, focusing on her face and upper body in a close-up shot. The overall composition creates an intimate and slightly mysterious mood, emphasizing the character's expressive features and emotional state."
